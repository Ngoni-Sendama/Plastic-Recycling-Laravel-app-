    SyncPullResponse:
      type: object
      required: [server_time, changes, deleted]
      properties:
        server_time:
          type: string
          format: date-time
          description: Use as `since` on the next pull
        changes:
          type: object
          description: Maps table name to live records changed since `since`
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SyncRow'
        deleted:
          type: object
          description: Maps table name to soft-deleted records changed since `since`
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SyncRow'
    SyncRow:
      oneOf:
        - $ref: '#/components/schemas/Material'
        - $ref: '#/components/schemas/MaterialIntake'
        - $ref: '#/components/schemas/CrushingProduction'
        - $ref: '#/components/schemas/Dispatch'
        - $ref: '#/components/schemas/PalletizingReceipt'
        - $ref: '#/components/schemas/PalletizingProduction'
        - $ref: '#/components/schemas/PelletSale'
        - $ref: '#/components/schemas/CashRemittance'
    SyncPushRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SyncChange'
          example:
            pellet_sales:
              - local_id: uuid-1
                server_id: null
                server_lock_version: null
                deleted: false
                data:
                  date: '2026-08-01'
                  receipt_number: R-9001
                  customer_name: PlastCo
                  kg_sold: 500
                  unit_price: 2.4
    SyncChange:
      type: object
      required: [local_id, data]
      properties:
        local_id:
          type: string
          description: Client-generated id for idempotent bookkeeping
        server_id:
          type: integer
          nullable: true
          description: Server record id; null when creating a new record
        server_lock_version:
          type: integer
          nullable: true
          description: lock_version the client last saw; null for new records
        deleted:
          type: boolean
          default: false
          description: Soft-delete this server record (requires a valid server_id + version)
        data:
          type: object
          description: Fields to create or merge (same rules as the matching store endpoint)
    SyncPushResponse:
      type: object
      required: [accepted, conflicts, rejected]
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/SyncAccepted'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SyncConflict'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/SyncRejected'
    SyncAccepted:
      type: object
      properties:
        table:
          type: string
        local_id:
          type: string
        status:
          type: string
          example: accepted
        server_id:
          type: integer
          nullable: true
        lock_version:
          type: integer
          nullable: true
        deleted:
          type: boolean
          description: Present only when the change was a delete
    SyncConflict:
      type: object
      properties:
        table:
          type: string
        local_id:
          type: string
        status:
          type: string
          example: conflict
        server_id:
          type: integer
        conflict_id:
          type: integer
          description: Id of the record created in sync_conflicts for admin review
        server_version:
          type: integer
          description: Current server lock_version; the client must re-pull to resolve
    SyncRejected:
      type: object
      properties:
        table:
          type: string
        local_id:
          type: string
          nullable: true
        errors:
          oneOf:
            - type: object
              description: Field validation errors (message + errors map)
              additionalProperties:
                type: array
                items:
                  type: string
            - type: array
              description: Generic server error messages
              items:
                type: string
