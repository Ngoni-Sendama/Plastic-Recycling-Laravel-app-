<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plastic Recycling API — Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <style>
        :root {
            --brand: #f59e0b;          /* amber accent */
            --brand-dark: #b45309;
            --header-bg: #1c1917;
            --header-fg: #f5f5f4;
            --muted: #a8a29e;
            --body-bg: #fafaf9;
            --border: #e7e5e4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--body-bg);
            color: #292524;
        }

        /* Header */
        .docs-header {
            background: linear-gradient(135deg, var(--header-bg) 0%, #292524 100%);
            color: var(--header-fg);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            border-bottom: 3px solid var(--brand);
        }

        .docs-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }

        .docs-brand-mark {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.5rem;
            background: var(--brand);
            color: #1c1917;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .docs-brand h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .docs-brand p {
            margin: 0;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .docs-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .docs-nav a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--header-fg);
            text-decoration: none;
            padding: 0.4rem 0.85rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .docs-nav a:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: var(--brand);
            transform: translateY(-1px);
        }

        .docs-nav .primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #1c1917;
        }

        .docs-nav .primary:hover { background: #fbbf24; }

        /* Swagger UI tweaks to blend with the page */
        .swagger-ui { margin: 0 auto; }

        .swagger-ui .wrapper { padding: 1.25rem 1.5rem !important; }

        .swagger-ui .info { margin: 1rem 0 1.5rem !important; }

        .swagger-ui .info hgroup.main { margin: 0 0 0.75rem !important; }

        .swagger-ui .info .title { color: #1c1917; }

        .swagger-ui .info .base-url { background: #e7e5e4; }

        .swagger-ui .opblock-tag { border-bottom: 1px solid var(--border); }

        .swagger-ui .opblock { border: 1px solid var(--border) !important; }

        .docs-footer {
            text-align: center;
            padding: 1.25rem 1rem 1.75rem;
            font-size: 0.78rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            margin-top: 1rem;
        }

        .docs-footer a { color: var(--brand-dark); }

        @media (max-width: 640px) {
            .docs-header { padding: 0.6rem 1rem; }
            .docs-brand p { display: none; }
        }
    </style>
</head>
<body>

<header class="docs-header">
    <div class="docs-brand">
        <div class="docs-brand-mark">♻</div>
        <div>
            <h1>Plastic Recycling API</h1>
            <p>Backend API — Filament admin + React Native mobile client</p>
        </div>
    </div>
    <nav class="docs-nav" aria-label="Documentation navigation">
        <a href="/docs/api-reference.md" title="Human-readable guide with examples and the offline-sync protocol">
            📖 API reference
        </a>
        <a href="/docs/openapi.yaml" title="Download the raw OpenAPI spec">
            ⬇ Raw spec
        </a>
        <a id="editor-link" class="primary" href="https://editor.swagger.io/"
           target="_blank" rel="noopener" title="Open the spec in Swagger Editor">
            Open in editor ↗
        </a>
    </nav>
</header>

<div id="swagger-ui"></div>

<footer class="docs-footer">
    Served from <code>public/docs/</code> · Spec: <a href="/docs/openapi.yaml">openapi.yaml</a> (21 paths, 32 schemas) ·
    Companion guide: <a href="/docs/api-reference.md">api-reference.md</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        // Point the editor link at this host's spec so it works on any domain.
        document.getElementById('editor-link').href =
            'https://editor.swagger.io/?url=' +
            encodeURIComponent(location.origin + '/docs/openapi.yaml');

        window.ui = SwaggerUIBundle({
            url: '/docs/openapi.yaml',
            dom_id: '#swagger-ui',
            deepLinking: true,
            docExpansion: 'list',
            filter: true,
            persistAuthorization: true,
            presets: [
                SwaggerUIBundle.presets.apis,
            ],
            layout: 'BaseLayout',
        });
    });
</script>
</body>
</html>
